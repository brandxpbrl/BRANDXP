<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ORBis — Welcome</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#01030a;color:#eefcff;font-family:Arial,Helvetica,sans-serif}body{overflow:hidden}#space{position:fixed;inset:0}canvas{display:block} .veil{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 42%,transparent 0,rgba(1,3,10,.08) 34%,rgba(1,3,10,.8) 100%)}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.128.0/build/three.module.js","three/examples/jsm/":"https://unpkg.com/three@0.128.0/examples/jsm/"}}</script>
</head>
<body>
<div id="space"></div><div class="veil"></div>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/examples/jsm/loaders/GLTFLoader.js';
const host=document.getElementById('space'), scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,1000);
camera.position.set(0,0.2,7);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);host.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0x8090ff,1.1));
const cyan=new THREE.PointLight(0x00eaff,5,18);cyan.position.set(4,3,4);scene.add(cyan);
const magenta=new THREE.PointLight(0xff20df,4,18);magenta.position.set(-4,-2,3);scene.add(magenta);
const particles=new THREE.BufferGeometry(), count=900, pos=new Float32Array(count*3);
for(let i=0;i<pos.length;i++)pos[i]=(Math.random()-.5)*24;
particles.setAttribute('position',new THREE.BufferAttribute(pos,3));
const dust=new THREE.Points(particles,new THREE.PointsMaterial({color:0x54eaff,size:.035,transparent:true,opacity:.65,blending:THREE.AdditiveBlending}));
scene.add(dust);
let solid=null, wire=null, active='solid';
function materialize(root, wireframe){
 root.traverse(o=>{if(!o.isMesh)return; const mats=Array.isArray(o.material)?o.material:[o.material]; o.material=mats.map(m=>wireframe?new THREE.MeshBasicMaterial({color:0x71edff,wireframe:true,transparent:true,opacity:.9}):m.clone());});
}
new GLTFLoader().load('/orbis/nodo_genesis.glb',g=>{
 solid=g.scene; const box=new THREE.Box3().setFromObject(solid), size=box.getSize(new THREE.Vector3()), center=box.getCenter(new THREE.Vector3());
 const scale=3.6/Math.max(size.x,size.y,size.z); solid.scale.setScalar(scale); solid.position.sub(center.multiplyScalar(scale)); materialize(solid,false); scene.add(solid);
 wire=solid.clone(true); materialize(wire,true); wire.visible=false; scene.add(wire);
},undefined,err=>console.warn('Nodo Genesis no cargó',err));
function toggleWireframe(){if(!solid||!wire)return;active=active==='solid'?'wire':'solid';solid.visible=active==='solid';wire.visible=!solid.visible;}
document.getElementById('start').onclick=()=>{const text='Bienvenido a ORBIS. Un ecosistema conectado de marcas, experiencias, tecnología y posibilidades.'; if('speechSynthesis' in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(text));}document.getElementById('intro').classList.add('visible');setTimeout(toggleWireframe,2600);setTimeout(toggleWireframe,5600)};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();dust.rotation.y=t*.025;dust.rotation.x=t*.008;if(solid)solid.rotation.y=t*.12;if(wire)wire.rotation.y=t*.12;cyan.intensity=4.5+Math.sin(t*1.8);magenta.intensity=3.5+Math.cos(t*1.3);renderer.render(scene,camera)}animate();
</script></body></html>
