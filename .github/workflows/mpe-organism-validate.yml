name: MPE Organism Validate

on:
  push:
    branches:
      - feat/mpe-organism-v0-1
    paths:
      - 'viptour-buzios/**'
      - '.github/workflows/mpe-organism-validate.yml'
  pull_request:
    paths:
      - 'viptour-buzios/**'
      - '.github/workflows/mpe-organism-validate.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viptour-buzios
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: viptour-buzios/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
